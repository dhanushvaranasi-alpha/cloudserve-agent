<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-label="Three stacked layers: an interface layer with FastAPI and the CLI harness, calling down into an orchestration layer centered on pipeline.py and the five component modules, which calls down into a persistence and integration layer of SQLite, Chroma and Groq." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ls-a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <style>
      text { font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace; fill: #16202b; }
      .label-title { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-weight: 600; }
    </style>
  </defs>
  <rect x="0" y="0" width="1080" height="300" fill="#ffffff"/>

  <rect x="20" y="20" width="1040" height="70" rx="8" fill="#eef1f5" stroke="#c9d2dc"/>
  <text x="40" y="42" font-size="10.5" fill="#3a5a8c" class="label-title">INTERFACE LAYER</text>
  <g font-size="11.5">
    <rect x="40" y="52" width="280" height="28" rx="5" fill="#ffffff" stroke="#16202b"/>
    <text x="180" y="70" text-anchor="middle">FastAPI -- src/api/main.py (+ demo UI)</text>
    <rect x="340" y="52" width="260" height="28" rx="5" fill="#ffffff" stroke="#16202b"/>
    <text x="470" y="70" text-anchor="middle">CLI -- evaluation/harness.py</text>
  </g>

  <rect x="20" y="115" width="1040" height="70" rx="8" fill="#e4f0ec" stroke="#1f6f5c"/>
  <text x="40" y="137" font-size="10.5" fill="#1f6f5c" class="label-title">ORCHESTRATION LAYER</text>
  <g font-size="11.5">
    <rect x="40" y="147" width="220" height="28" rx="5" fill="#ffffff" stroke="#1f6f5c" stroke-width="1.4"/>
    <text x="150" y="165" text-anchor="middle">pipeline.py -- run_ticket()</text>
    <rect x="280" y="147" width="620" height="28" rx="5" fill="#ffffff" stroke="#16202b"/>
    <text x="590" y="165" text-anchor="middle">classify . retrieve . route . generate . validate modules</text>
  </g>

  <rect x="20" y="210" width="1040" height="70" rx="8" fill="#e6ebf4" stroke="#3a5a8c"/>
  <text x="40" y="232" font-size="10.5" fill="#3a5a8c" class="label-title">PERSISTENCE &amp; INTEGRATION LAYER</text>
  <g font-size="11.5">
    <rect x="40" y="242" width="220" height="28" rx="5" fill="#ffffff" stroke="#3a5a8c"/>
    <text x="150" y="260" text-anchor="middle">SQLite -- decision_log.py</text>
    <rect x="280" y="242" width="220" height="28" rx="5" fill="#ffffff" stroke="#3a5a8c"/>
    <text x="390" y="260" text-anchor="middle">Chroma vector store</text>
    <rect x="520" y="242" width="220" height="28" rx="5" fill="#ffffff" stroke="#3a5a8c"/>
    <text x="630" y="260" text-anchor="middle">Groq -- llm_client.py</text>
  </g>

  <g stroke="#16202b" fill="none">
    <path d="M540,90 L540,115" marker-end="url(#ls-a3)"/>
    <path d="M540,185 L540,210" marker-end="url(#ls-a3)"/>
  </g>
  <text x="548" y="105" font-size="10">calls run_ticket()</text>
  <text x="548" y="200" font-size="10">reads / writes</text>
</svg>
