<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" role="img" aria-label="Decision cascade: fallback-used, then always-escalate intent, then no grounding found, then confidence below threshold, each escalating on trigger; if none trigger, the ticket proceeds to generate and validate, which either sends the answer or escalates on a guardrail block." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="rc-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <style>
      text { font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace; fill: #16202b; }
      .label-title { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-weight: 600; }
    </style>
  </defs>
  <rect x="0" y="0" width="700" height="640" fill="#ffffff"/>

  <g font-size="12">
    <!-- node 1 -->
    <rect x="20" y="20" width="480" height="70" rx="8" fill="#ffffff" stroke="#16202b" stroke-width="1.3"/>
    <text x="260" y="50" text-anchor="middle" class="label-title">Classifier used its fallback?</text>
    <text x="260" y="68" text-anchor="middle" font-size="10.5" opacity="0.65">(provider down, or an unparseable response)</text>

    <!-- node 2 -->
    <rect x="20" y="150" width="480" height="70" rx="8" fill="#ffffff" stroke="#16202b" stroke-width="1.3"/>
    <text x="260" y="180" text-anchor="middle" class="label-title">Intent is always-escalate?</text>
    <text x="260" y="198" text-anchor="middle" font-size="10.5" opacity="0.65">compliance, security, feature_request, unclear_request</text>

    <!-- node 3 -->
    <rect x="20" y="280" width="480" height="70" rx="8" fill="#ffffff" stroke="#16202b" stroke-width="1.3"/>
    <text x="260" y="310" text-anchor="middle" class="label-title">Retrieval found grounding?</text>
    <text x="260" y="328" text-anchor="middle" font-size="10.5" opacity="0.65">a passage above the 0.35 relevance threshold</text>

    <!-- node 4 -->
    <rect x="20" y="410" width="480" height="70" rx="8" fill="#ffffff" stroke="#16202b" stroke-width="1.3"/>
    <text x="260" y="440" text-anchor="middle" class="label-title">Confidence &#8805; threshold?</text>
    <text x="260" y="458" text-anchor="middle" font-size="10.5" opacity="0.65">CONFIDENCE_THRESHOLD, default 0.80</text>

    <!-- final node -->
    <rect x="20" y="540" width="480" height="80" rx="8" fill="#e4f0ec" stroke="#1f6f5c" stroke-width="1.3"/>
    <text x="260" y="568" text-anchor="middle" class="label-title" fill="#1f6f5c">AUTO_RESPOND &#8594; generate &#8594; validate</text>
    <text x="260" y="586" text-anchor="middle" font-size="10.5" opacity="0.75">a guardrail failure here still escalates</text>
    <text x="260" y="602" text-anchor="middle" font-size="10.5" opacity="0.75">(see the flow diagram above)</text>
  </g>

  <!-- escalate pills -->
  <g font-size="11.5">
    <rect x="540" y="35" width="140" height="40" rx="20" fill="#f6e9dd" stroke="#a35a1f"/>
    <text x="610" y="60" text-anchor="middle" fill="#a35a1f" class="label-title">ESCALATE</text>

    <rect x="540" y="165" width="140" height="40" rx="20" fill="#f6e9dd" stroke="#a35a1f"/>
    <text x="610" y="190" text-anchor="middle" fill="#a35a1f" class="label-title">ESCALATE</text>

    <rect x="540" y="295" width="140" height="40" rx="20" fill="#f6e9dd" stroke="#a35a1f"/>
    <text x="610" y="320" text-anchor="middle" fill="#a35a1f" class="label-title">ESCALATE</text>

    <rect x="540" y="425" width="140" height="40" rx="20" fill="#f6e9dd" stroke="#a35a1f"/>
    <text x="610" y="450" text-anchor="middle" fill="#a35a1f" class="label-title">ESCALATE</text>
  </g>

  <!-- yes/no side arrows -->
  <g stroke="#a35a1f" fill="none" color="#a35a1f" font-size="10.5">
    <path d="M500,55 L540,55" marker-end="url(#rc-a2)"/>
    <path d="M500,185 L540,185" marker-end="url(#rc-a2)"/>
    <path d="M500,315 L540,315" marker-end="url(#rc-a2)"/>
    <path d="M500,445 L540,445" marker-end="url(#rc-a2)"/>
  </g>
  <text x="505" y="48" fill="#a35a1f" font-size="10.5">yes</text>
  <text x="505" y="178" fill="#a35a1f" font-size="10.5">yes</text>
  <text x="505" y="308" fill="#a35a1f" font-size="10.5">no</text>
  <text x="505" y="438" fill="#a35a1f" font-size="10.5">no</text>

  <!-- down arrows between nodes -->
  <g stroke="#16202b" fill="none">
    <path d="M260,90 L260,150" marker-end="url(#rc-a2)"/>
    <path d="M260,220 L260,280" marker-end="url(#rc-a2)"/>
    <path d="M260,350 L260,410" marker-end="url(#rc-a2)"/>
    <path d="M260,480 L260,540" marker-end="url(#rc-a2)"/>
  </g>
  <text x="268" y="115" font-size="10.5" opacity="0.6">no</text>
  <text x="268" y="245" font-size="10.5" opacity="0.6">no</text>
  <text x="268" y="375" font-size="10.5" opacity="0.6">yes</text>
  <text x="268" y="505" font-size="10.5" opacity="0.6">yes</text>
</svg>
